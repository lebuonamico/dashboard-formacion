name: app_finnegans
description: "Dashboard de formación interna de Finnegans."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^10.3.3
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.0
  flutter_markdown_plus: ^1.0.12
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
